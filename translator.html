<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickLingo — Language Translation Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f5f3ff);color:#18213b;min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(850px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px #343c6b20}
header{text-align:center;margin-bottom:24px}header .logo{font-size:38px}h1{margin:8px 0;font-size:30px}p{color:#68718a;line-height:1.5}
.languages{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin:18px 0}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px;color:#46516d}select,textarea{width:100%;border:1px solid #dce1ee;border-radius:12px;padding:12px;font:inherit;background:#fff;color:#18213b}
textarea{min-height:165px;resize:vertical}.swap{border:0;background:#ede9fe;border-radius:12px;padding:12px;cursor:pointer;font-size:20px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #e2e6f0;border-radius:16px;padding:14px;background:#fbfcff}
.output{white-space:pre-wrap;min-height:165px;line-height:1.55;color:#29324c;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.primary{background:#5b4be7;color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:bold;cursor:pointer}
button.secondary{background:#f0efff;color:#4d3fd0;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.status{font-size:13px;margin-top:12px;min-height:20px}.foot{font-size:12px;text-align:center;margin-top:18px;color:#8790a7}
@media(max-width:620px){main{padding:18px}.panels{grid-template-columns:1fr}.languages{grid-template-columns:1fr auto 1fr}h1{font-size:25px}}
</style></head><body><main>
<header><div class="logo">🌐</div><h1>QuickLingo</h1><p>A simple language translation tool for students</p></header>
<div class="languages">
<div><label for="sourceLang">FROM</label><select id="sourceLang"><option value="en">English</option><option value="hi">Hindi</option><option value="mr">Marathi</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="ja">Japanese</option><option value="ar">Arabic</option><option value="bn">Bengali</option><option value="ta">Tamil</option></select></div>
<button class="swap" id="swap" title="Swap languages">⇄</button>
<div><label for="targetLang">TO</label><select id="targetLang"><option value="hi">Hindi</option><option value="en">English</option><option value="mr">Marathi</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="ja">Japanese</option><option value="ar">Arabic</option><option value="bn">Bengali</option><option value="ta">Tamil</option></select></div>
</div>
<div class="panels">
<section class="panel"><label for="sourceText">YOUR TEXT</label><textarea id="sourceText" placeholder="Type a word, sentence, or paragraph...">Hello, how are you?</textarea><div style="text-align:right;font-size:12px;color:#8991a6" id="count">0 characters</div></section>
<section class="panel"><label>TRANSLATED TEXT</label><div class="output" id="result">Your translation will appear here.</div></section>
</div>
<div class="actions"><button class="primary" id="translate">Translate text</button><button class="secondary" id="copy">Copy result</button><button class="secondary" id="speak">🔊 Speak result</button><button class="secondary" id="clear">Clear</button></div>
<div class="status" id="status" role="status"></div>
<div class="foot">Demo uses the MyMemory translation service and needs internet access. Translation quality and service limits may vary.</div>
</main><script>
const $=id=>document.getElementById(id);
const langs={en:"English",hi:"Hindi",mr:"Marathi",es:"Spanish",fr:"French",de:"German",ja:"Japanese",ar:"Arabic",bn:"Bengali",ta:"Tamil"};
$("sourceText").addEventListener("input",()=> $("count").textContent=$("sourceText").value.length+" characters");
$("swap").onclick=()=>{const a=$("sourceLang").value;$("sourceLang").value=$("targetLang").value;$("targetLang").value=a;const old=$("sourceText").value;$("sourceText").value=$("result").textContent;$("result").textContent=old||"Your translation will appear here.";};
$("translate").onclick=async()=>{
 const text=$("sourceText").value.trim(),from=$("sourceLang").value,to=$("targetLang").value;
 if(!text){$("status").textContent="Please enter some text first.";return}
 if(from===to){$("result").textContent=text;$("status").textContent="Source and target languages are the same.";return}
 $("translate").disabled=true;$("status").textContent="Translating…";$("result").textContent="";
 try{const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text.slice(0,450))+"&langpair="+from+"|"+to;
 const res=await fetch(url);if(!res.ok)throw Error("Translation service returned an error.");
 const data=await res.json();if(data.responseStatus!==200)throw Error(data.responseDetails||"Translation unavailable.");
 $("result").textContent=data.responseData.translatedText||"No translation returned.";
 $("status").textContent="Translated from "+langs[from]+" to "+langs[to]+".";
 }catch(e){$("result").textContent="";$("status").textContent="Could not translate. Check your internet connection and try again. ("+e.message+")"}
 finally{$("translate").disabled=false}
};
$("copy").onclick=async()=>{const t=$("result").textContent;if(!t||t==="Your translation will appear here."){$("status").textContent="Nothing to copy yet.";return}try{await navigator.clipboard.writeText(t);$("status").textContent="Translation copied."}catch{$("status").textContent="Copy is blocked by this browser. Please select and copy the text."}};
$("speak").onclick=()=>{const t=$("result").textContent;if(!t||t==="Your translation will appear here.")return;$("status").textContent="";const u=new SpeechSynthesisUtterance(t);u.lang=$("targetLang").value; speechSynthesis.speak(u)};
$("clear").onclick=()=>{$("sourceText").value="";$("result").textContent="Your translation will appear here.";$("status").textContent="";$("count").textContent="0 characters"};
</script></body></html>
